name: Update events

on:
  schedule:
    # Daily at 10:17 UTC = 3:17am Mountain in winter, 4:17am in summer
    - cron: "17 10 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" in the Actions tab any time

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect events
        run: python scripts/collect_events.py

      - name: Save if changed
        run: |
          git config user.name  "scout-and-tell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/events.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update events $(TZ=America/Denver date '+%Y-%m-%d')"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi
