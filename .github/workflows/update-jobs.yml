name: Update jobs

on:
  schedule:
    # Daily at 11:41 UTC = 4:41am Mountain in winter. Both sources are on free
    # plans: Adzuna only runs Sundays, Google Jobs (SerpApi) Mondays and Thursdays.
    # On other days the job just keeps the board tidy (removes old jobs).
    - cron: "41 11 * * *"
  workflow_dispatch:
    inputs:
      serpapi:
        description: "Also run Google Jobs today (uses ~22 of the 250 free monthly searches)"
        type: boolean
        default: false
      adzuna:
        description: "Also run Adzuna today (uses 5 of the 25 free monthly calls)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install requests==2.32.3

      - name: Collect jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          FORCE_SERPAPI: ${{ inputs.serpapi && 'true' || 'false' }}
          FORCE_ADZUNA: ${{ inputs.adzuna && 'true' || 'false' }}
        run: python scripts/collect_jobs.py

      - name: Save if changed
        run: |
          git config user.name  "scout-and-tell-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/jobs/jobs.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update jobs $(TZ=America/Denver date '+%Y-%m-%d')"
            git pull --rebase -X theirs origin main || git pull --rebase origin main
            git push
          fi
