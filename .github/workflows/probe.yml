name: Probe employer hiring systems (temporary)
on:
  push:
    branches: [probe-ats]
    paths: ["probe/**", "scripts/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests==2.32.3
      - run: ONLY_EMPLOYERS=true timeout 1200 python -u scripts/collect_jobs.py 2>&1 | tee probe/run4.log
        continue-on-error: true
      - if: always()
        run: |
          cp docs/jobs/jobs.json probe/jobs_run4.json
          git config user.name scout-and-tell-bot
          git config user.email actions@users.noreply.github.com
          git add probe
          git commit -m "probe run4 [skip ci]" || true
          git push
