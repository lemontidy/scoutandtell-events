name: Probe employer hiring systems (temporary)
on:
  push:
    branches: [probe-ats]
    paths: ["probe/**"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests==2.32.3
      - run: python probe/probe2.py
      - run: |
          git config user.name scout-and-tell-bot
          git config user.email actions@users.noreply.github.com
          git add probe || true
          git commit -m "probe report [skip ci]" || true
          git push
